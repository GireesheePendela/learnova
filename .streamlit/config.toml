# Learnova's "Marina" palette: cream (background), sky blue (surfaces), deep blue (text and
# main actions) and brown (accents). Tints of these are used for cards and borders.
[theme]
base = "light"
primaryColor = "#326080"
backgroundColor = "#FFF1E7"
secondaryBackgroundColor = "#B5D2E6"
textColor = "#326080"
font = "sans serif"

[client]
toolbarMode = "minimal"
